<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CA Tracker">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>CA Final Study Tracker</title>
<style>
  :root{
    --navy:#1f3864; --blue:#2e5395; --lightblue:#eaf0fb;
    --green:#1e8e3e; --greenbg:#dcf5e3;
    --amber:#b8860b; --amberbg:#fff2cc;
    --red:#c62828; --redbg:#fde2e2;
    --grey:#f4f5f7; --border:#dfe3e8; --text:#22293a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--grey);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  header h1{margin:0;font-size:1.3rem;font-weight:600;}
  #saveStatus{font-size:0.8rem;opacity:0.9;display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#7CFC7C;display:inline-block;transition:background .3s;}
  .dot.saving{background:#ffd54f;}
  .examBar{display:flex;align-items:center;gap:10px;font-size:0.85rem;}
  .examBar input{padding:4px 6px;border-radius:4px;border:none;}
  nav{display:flex;flex-wrap:wrap;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:5;}
  nav button{flex:1;min-width:110px;padding:12px 8px;border:none;background:#fff;cursor:pointer;font-size:0.85rem;font-weight:600;color:#556;border-bottom:3px solid transparent;}
  nav button.active{color:var(--navy);border-bottom:3px solid var(--blue);background:var(--lightblue);}
  main{padding:20px;max-width:1300px;margin:0 auto;}
  .tab{display:none;}
  .tab.active{display:block;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;}
  .card .num{font-size:1.6rem;font-weight:700;color:var(--navy);}
  .card .lbl{font-size:0.75rem;color:#667;margin-top:4px;text-transform:uppercase;letter-spacing:.03em;}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:0.85rem;}
  th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:middle;}
  th{background:var(--blue);color:#fff;font-size:0.75rem;text-transform:uppercase;letter-spacing:.02em;}
  tr:nth-child(even) td{background:#fafbfd;}
  select,input[type=date],input[type=number],input[type=text]{width:100%;padding:5px;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;background:#fff;}
  .status-select.Not-Started{background:var(--redbg);}
  .status-select.In-Progress{background:var(--amberbg);}
  .status-select.Completed{background:var(--greenbg);}
  .rev-select.Pending{background:var(--redbg);}
  .rev-select.In-Progress{background:var(--amberbg);}
  .rev-select.Done{background:var(--greenbg);}
  .progress-wrap{background:#e6e8ec;border-radius:6px;overflow:hidden;height:18px;width:100%;}
  .progress-fill{background:linear-gradient(90deg,var(--blue),var(--navy));height:100%;color:#fff;font-size:0.7rem;display:flex;align-items:center;justify-content:center;transition:width .4s;}
  .subject-table-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .dash-table td, .dash-table th{padding:10px;}
  .dash-table td.name{font-weight:600;color:var(--navy);}
  h2.tabtitle{color:var(--navy);margin-top:0;}
  .testform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;background:#fff;padding:16px;border-radius:8px;border:1px solid var(--border);margin-bottom:16px;}
  .testform label{font-size:0.72rem;color:#667;text-transform:uppercase;display:block;margin-bottom:4px;}
  #addTestBtn{grid-column:1/-1;background:var(--blue);color:#fff;border:none;padding:10px;border-radius:6px;font-weight:600;cursor:pointer;}
  #addTestBtn:hover{background:var(--navy);}
  .del-btn{background:var(--redbg);color:var(--red);border:1px solid var(--red);border-radius:4px;cursor:pointer;padding:4px 8px;font-size:0.75rem;}
  .note{font-size:0.78rem;color:#667;background:#fff;border:1px dashed var(--border);border-radius:6px;padding:10px 14px;margin-bottom:16px;}
  .exportBtn{background:transparent;border:1px solid #fff;color:#fff;border-radius:5px;padding:5px 10px;font-size:0.75rem;cursor:pointer;}
  .exportBtn:hover{background:rgba(255,255,255,.15);}

  /* ---- Mobile responsive: turn table rows into stacked cards ---- */
  @media (max-width: 720px){
    header{padding:12px 14px;}
    header h1{font-size:1.05rem;}
    .examBar{width:100%;justify-content:space-between;}
    nav button{min-width:80px;font-size:0.72rem;padding:10px 4px;}
    main{padding:10px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ position:absolute; top:-9999px; left:-9999px; }
    tbody tr{
      background:#fff;border:1px solid var(--border);border-radius:8px;
      margin-bottom:10px;padding:6px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    td{
      border:none !important;border-bottom:1px solid #eef0f3;
      padding:8px 10px 8px 44%;position:relative;min-height:34px;
      display:flex;align-items:center;
    }
    tr td:last-child{border-bottom:none;}
    td[data-label]:before{
      content:attr(data-label);position:absolute;left:10px;top:8px;
      width:38%;font-weight:700;font-size:0.68rem;text-transform:uppercase;
      color:var(--navy);white-space:normal;line-height:1.2;
    }
    td select, td input{width:100%;font-size:1rem;padding:8px;min-height:38px;}
    td[data-label="Chapter / Topic"]{font-weight:600;padding-top:10px;}
    td[data-label="#"]{display:none;}
    .testform{grid-template-columns:1fr 1fr;}
    .testform > div[style*="grid-column"]{grid-column:1/-1;}
    #addTestBtn{font-size:1rem;padding:14px;}
  }
</style>
</head>
<body>

<header>
  <h1>📘 CA Final Study Tracker</h1>
  <div class="examBar">
    Exam Date: <input type="date" id="examDate">
    <span id="countdown"></span>
  </div>
  <div id="saveStatus"><span class="dot" id="saveDot"></span><span id="saveText">Loading…</span>
    <button class="exportBtn" id="exportBtn">⬇ Backup JSON</button>
  </div>
</header>

<nav id="tabNav"></nav>
<main id="main"></main>

<script>
/* ---------------- Subject catalog (edit chapter names/subjects to match your ICAI study material) ---------------- */
const CATALOG = {
  FR: { name: "Financial Reporting", chapters: [
    "Framework for Preparation of Financial Statements",
    "Ind AS 1 - Presentation of Financial Statements",
    "Ind AS 2 - Inventories",
    "Ind AS 7 - Statement of Cash Flows",
    "Ind AS 8 - Accounting Policies, Changes in Estimates and Errors",
    "Ind AS 10 - Events after the Reporting Period",
    "Ind AS 12 - Income Taxes",
    "Ind AS 16 - Property, Plant and Equipment",
    "Ind AS 19 - Employee Benefits",
    "Ind AS 20 - Government Grants and Disclosure of Government Assistance",
    "Ind AS 21 - Effects of Changes in Foreign Exchange Rates",
    "Ind AS 23 - Borrowing Costs",
    "Ind AS 24 - Related Party Disclosures",
    "Ind AS 33 - Earnings per Share",
    "Ind AS 34 - Interim Financial Reporting",
    "Ind AS 36 - Impairment of Assets",
    "Ind AS 37 - Provisions, Contingent Liabilities and Contingent Assets",
    "Ind AS 38 - Intangible Assets",
    "Ind AS 40 - Investment Property",
    "Ind AS 41 - Agriculture",
    "Ind AS 101 - First-time Adoption of Ind AS",
    "Ind AS 102 - Share-based Payment",
    "Ind AS 103 - Business Combinations",
    "Ind AS 105 - Non-current Assets Held for Sale and Discontinued Operations",
    "Ind AS 107 - Financial Instruments: Disclosures",
    "Ind AS 108 - Operating Segments",
    "Ind AS 109 - Financial Instruments",
    "Ind AS 110 - Consolidated Financial Statements",
    "Ind AS 111 - Joint Arrangements",
    "Ind AS 112 - Disclosure of Interests in Other Entities",
    "Ind AS 113 - Fair Value Measurement",
    "Ind AS 114 - Regulatory Deferral Accounts",
    "Ind AS 115 - Revenue from Contracts with Customers",
    "Ind AS 116 - Leases",
    "Analysis of Financial Statements",
    "Recent ICAI Study Material Updates" ]},
  AFM: { name: "Advanced Financial Management", chapters: [
    "Financial Policy and Corporate Strategy","Risk Management","Advanced Capital Budgeting Decisions",
    "Security Analysis","Security Valuation","Portfolio Management","Securitization","Mutual Funds",
    "Derivatives Analysis and Valuation","Foreign Exchange Exposure and Risk Management",
    "International Financial Management","Interest Rate Risk Management","Business Valuation",
    "Mergers, Acquisitions & Corporate Restructuring","Startup Finance" ]},
  AUDIT: { name: "Advanced Auditing, Assurance & Professional Ethics", chapters: [
    "Quality Control & Engagement Standards","Audit Planning, Strategy and Execution",
    "Risk Assessment and Internal Control","Audit of Financial Statements (SAs)","Audit Reports",
    "Audit of Consolidated Financial Statements","Audit of Banks","Audit of Insurance Companies & NBFCs",
    "Audit of Public Sector Undertakings","Internal Audit","Due Diligence, Investigation & Forensic Accounting",
    "Peer Review & Quality Review","Professional Ethics","Liabilities of Auditors",
    "SA 700 Series & Reporting under Companies Act" ]},
  DT: { name: "Direct Tax Laws & International Taxation", chapters: [
    "Basis of Charge, Residential Status & Scope of Total Income",
    "Income from Salary / House Property (Advanced Issues)",
    "Profits & Gains of Business or Profession (Advanced)",
    "Capital Gains (Advanced Issues)","Income from Other Sources & Clubbing Provisions",
    "Set off & Carry Forward of Losses","Deductions under Chapter VI-A",
    "Assessment of Individuals, HUF, Firms, LLP","Assessment of Companies (incl. MAT)",
    "Assessment of Trusts, NGOs & Charitable Institutions",
    "Taxation of Business Reorganisation (Amalgamation, Demerger, Slump Sale)",
    "TDS & TCS Provisions","Advance Tax, Interest & Refunds","Assessment Procedure & Appeals",
    "Penalties & Prosecution","Settlement / Dispute Resolution / Faceless Schemes",
    "Transfer Pricing - Basic Concepts & Methods","Transfer Pricing - Advanced Issues (APA, Safe Harbour, GAAR)",
    "Non-Resident Taxation & Double Taxation Relief","Advance Rulings & Equalisation Levy",
    "Model Tax Conventions (OECD/UN) Overview","Base Erosion and Profit Shifting (BEPS)",
    "Application & Interpretation of Tax Treaties",
    "Foreign Remittance & Withholding Tax Analysis (FTS/Royalty/FIS)" ]},
  IDT: { name: "Indirect Tax Laws (GST + Customs & FTP)", chapters: [
    "Supply under GST - Concept & Scope","Charge of GST & Composition Levy","Exemptions under GST",
    "Place of Supply","Time of Supply & Value of Supply","Input Tax Credit","Registration under GST",
    "Tax Invoice, Credit/Debit Notes, E-way Bill","Accounts, Records & E-invoicing",
    "Payment of Tax & TDS/TCS under GST","Returns under GST","Import & Export under GST (incl. Refunds)",
    "Assessment & Audit under GST","Inspection, Search, Seizure & Arrest","Demand & Recovery",
    "Offences, Penalties & Ethics under GST","Appeals & Revision under GST","Advance Ruling under GST",
    "Miscellaneous Provisions under GST","Customs Act - Basic Concepts & Levy",
    "Duty Types, Valuation & Classification (Customs)","Import/Export Procedures, Warehousing & Baggage",
    "Customs - Refund, Demand & Recovery","Foreign Trade Policy (FTP)" ]},
  IBS: { name: "Integrated Business Solutions (Case Study)", chapters: [
    "Strategic Management - Concepts & Business Strategy","Corporate Governance & Business Ethics",
    "Enterprise Risk Management","Advanced Performance Management Concepts",
    "Financial Management Application (Case-based)","Direct & Indirect Tax Application (Case-based)",
    "Audit & Assurance Application (Case-based)","Costing & Decision Making (Case-based)",
    "Economic, Business and Regulatory Environment","Practice - Integrated Case Study Mock Sets" ]}
};
const STATUS_OPTS = ["Not Started","In Progress","Completed"];
const REV_OPTS = ["Pending","In Progress","Done"];
const STORAGE_KEY = "ca-final-tracker-data-v1";

let state = null;
let saveTimer = null;

function defaultState(){
  const subjects = {};
  Object.keys(CATALOG).forEach(k=>{
    subjects[k] = { chapters: CATALOG[k].chapters.map(()=>({
      status:"Not Started", studyDate:"", rev1:"Pending", rev2:"Pending", rev3:"Pending",
      qb:"Not Started", tests:0, marks:0, notes:""
    }))};
  });
  return { examDate:"", subjects, testLog:[] };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const def = defaultState();
      Object.keys(def.subjects).forEach(k=>{
        if(!parsed.subjects[k] || !Array.isArray(parsed.subjects[k].chapters) ||
           parsed.subjects[k].chapters.length !== CATALOG[k].chapters.length){
          parsed.subjects[k] = def.subjects[k];
        } else {
          parsed.subjects[k].chapters.forEach(c=>{
            if(c.qb === undefined) c.qb = "Not Started";
            if(c.marks === undefined) c.marks = c.avgScore !== undefined ? c.avgScore : 0;
          });
        }
      });
      if(!parsed.testLog) parsed.testLog = [];
      parsed.testLog.forEach(t=>{
        if(t.category === undefined) t.category = "";
        if(t.source === undefined) t.source = "";
      });
      state = parsed;
    } else {
      state = defaultState();
    }
  }catch(e){
    state = defaultState();
  }
}

function setSaveStatus(saving){
  const dot = document.getElementById("saveDot");
  const txt = document.getElementById("saveText");
  if(saving){ dot.classList.add("saving"); txt.textContent = "Saving…"; }
  else { dot.classList.remove("saving"); txt.textContent = "All changes saved"; }
}

function queueSave(){
  setSaveStatus(true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 500);
}

function saveNow(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSaveStatus(false);
  }catch(e){
    document.getElementById("saveText").textContent = "Save failed - browser storage may be full or blocked";
  }
}

function cls(s){ return s.replace(/\s+/g,"-"); }

function updateCountdown(){
  const el = document.getElementById("countdown");
  if(!state.examDate){ el.textContent = ""; return; }
  const d = new Date(state.examDate); const now = new Date();
  const days = Math.ceil((d - now)/86400000);
  el.textContent = days >= 0 ? `(${days} days left)` : "(exam date passed)";
}

/* ---------------- Dashboard ---------------- */
function computeSubjectStats(k){
  const chs = state.subjects[k].chapters;
  const total = chs.length;
  const completed = chs.filter(c=>c.status==="Completed").length;
  const inprog = chs.filter(c=>c.status==="In Progress").length;
  const notstarted = total - completed - inprog;
  const testsForSubj = state.testLog.filter(t=>t.subject===k);
  let avgScore = 0;
  if(testsForSubj.length){
    avgScore = testsForSubj.reduce((s,t)=> s + (t.total>0 ? (t.marks/t.total*100) : 0),0)/testsForSubj.length;
  }
  const rev3Done = chs.filter(c=>c.rev3==="Done").length;
  const qbDone = chs.filter(c=>c.qb==="Completed").length;
  return {total,completed,inprog,notstarted,pct: total? Math.round(completed/total*100):0, avgScore: Math.round(avgScore), testsCount: testsForSubj.length, rev3Done, qbDone, qbPct: total? Math.round(qbDone/total*100):0};
}

function renderDashboard(){
  const wrap = document.getElementById("dash-content");
  if(!wrap) return;
  let totalCh=0, totalDone=0, totalTests=state.testLog.length;
  let rows = "";
  Object.keys(CATALOG).forEach(k=>{
    const s = computeSubjectStats(k);
    totalCh += s.total; totalDone += s.completed;
    rows += `<tr>
      <td class="name" data-label="Subject">${CATALOG[k].name}</td>
      <td data-label="Total">${s.total}</td>
      <td data-label="Completed">${s.completed}</td>
      <td data-label="In Progress">${s.inprog}</td>
      <td data-label="Not Started">${s.notstarted}</td>
      <td data-label="Syllabus Progress" style="min-width:140px;">
        <div class="progress-wrap"><div class="progress-fill" style="width:${s.pct}%">${s.pct}%</div></div>
      </td>
      <td data-label="Question Bank Progress" style="min-width:120px;">
        <div class="progress-wrap"><div class="progress-fill" style="width:${s.qbPct}%">${s.qbPct}%</div></div>
      </td>
      <td data-label="Tests">${s.testsCount}</td>
      <td data-label="Avg Score">${s.testsCount? s.avgScore+'%':'—'}</td>
      <td data-label="Final Revision">${s.rev3Done}/${s.total}</td>
    </tr>`;
  });
  const overallPct = totalCh? Math.round(totalDone/totalCh*100):0;

  wrap.innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${overallPct}%</div><div class="lbl">Overall Syllabus Done</div></div>
      <div class="card"><div class="num">${totalDone}/${totalCh}</div><div class="lbl">Chapters Completed</div></div>
      <div class="card"><div class="num">${totalTests}</div><div class="lbl">Tests Logged</div></div>
      <div class="card"><div class="num">${Object.keys(CATALOG).length}</div><div class="lbl">Subjects</div></div>
    </div>
    <div class="subject-table-wrap">
    <table class="dash-table">
      <thead><tr><th>Subject</th><th>Total</th><th>Completed</th><th>In Progress</th><th>Not Started</th><th>Syllabus Progress</th><th>Question Bank Progress</th><th>Tests</th><th>Avg Score</th><th>Final Revision</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <p class="note">Tip: mark a chapter "Completed" as soon as first study pass is done, then track Revision 1 / 2 / 3 separately as you cycle back through the syllabus. This dashboard updates live from every subject tab and the Test Log.</p>
    <p class="note">Warning: this version saves to this browser local storage, tied to this exact file. Always reopen it from the same saved file in the same browser on the same device, do not re-download a fresh copy or clear browser data, or you will lose your entries. Click the Backup JSON button occasionally as a safety copy.</p>
  `;
}

/* ---------------- Subject tab ---------------- */
function renderSubjectTab(k){
  const info = CATALOG[k];
  const chs = state.subjects[k].chapters;
  const showTestsMarks = k !== "FR";
  let rows = "";
  chs.forEach((c,i)=>{
    rows += `<tr>
      <td data-label="#" style="text-align:center;">${i+1}</td>
      <td data-label="Chapter / Topic">${info.chapters[i]}</td>
      <td data-label="Status"><select class="status-select ${cls(c.status)}" data-k="${k}" data-i="${i}" data-f="status">
        ${STATUS_OPTS.map(o=>`<option ${o===c.status?"selected":""}>${o}</option>`).join("")}
      </select></td>
      <td data-label="Studied On"><input type="date" data-k="${k}" data-i="${i}" data-f="studyDate" value="${c.studyDate}"></td>
      <td data-label="Rev 1"><select class="rev-select ${cls(c.rev1)}" data-k="${k}" data-i="${i}" data-f="rev1">${REV_OPTS.map(o=>`<option ${o===c.rev1?"selected":""}>${o}</option>`).join("")}</select></td>
      <td data-label="Rev 2"><select class="rev-select ${cls(c.rev2)}" data-k="${k}" data-i="${i}" data-f="rev2">${REV_OPTS.map(o=>`<option ${o===c.rev2?"selected":""}>${o}</option>`).join("")}</select></td>
      <td data-label="Rev 3"><select class="rev-select ${cls(c.rev3)}" data-k="${k}" data-i="${i}" data-f="rev3">${REV_OPTS.map(o=>`<option ${o===c.rev3?"selected":""}>${o}</option>`).join("")}</select></td>
      <td data-label="Question Bank"><select class="status-select ${cls(c.qb)}" data-k="${k}" data-i="${i}" data-f="qb">${STATUS_OPTS.map(o=>`<option ${o===c.qb?"selected":""}>${o}</option>`).join("")}</select></td>
      ${showTestsMarks ? `<td data-label="Tests"><input type="number" min="0" style="width:55px" data-k="${k}" data-i="${i}" data-f="tests" value="${c.tests}"></td>` : ""}
      ${showTestsMarks ? `<td data-label="Marks"><input type="number" min="0" style="width:55px" data-k="${k}" data-i="${i}" data-f="marks" value="${c.marks}"></td>` : ""}
      <td data-label="Notes"><input type="text" placeholder="weak areas / remarks" data-k="${k}" data-i="${i}" data-f="notes" value="${c.notes.replace(/"/g,'&quot;')}"></td>
    </tr>`;
  });
  const testsMarksHeaders = showTestsMarks ? "<th>Tests</th><th>Marks</th>" : "";
  return `
    <h2 class="tabtitle">${info.name}</h2>
    ${k==="FR" ? '<p class="note">Chapter-level Tests/Marks tracking is off for Financial Reporting - log Ind AS-wise chapter tests and marks under the "Chapter Test" category in the Test Series tab instead.</p>' : ""}
    <div class="subject-table-wrap">
    <table>
      <thead><tr><th>#</th><th>Chapter / Topic</th><th>Status</th><th>Studied On</th><th>Rev 1</th><th>Rev 2</th><th>Rev 3</th><th>Question Bank</th>${testsMarksHeaders}<th>Notes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;
}

function attachSubjectListeners(k){
  const container = document.getElementById(`tab-${k}`);
  container.querySelectorAll("select,input").forEach(el=>{
    const evt = el.tagName==="SELECT" ? "change" : (el.type==="date"||el.type==="number" ? "change":"input");
    el.addEventListener(evt, (e)=>{
      const {k:key,i,f} = e.target.dataset;
      let val = e.target.value;
      if(f==="tests"||f==="marks") val = Number(val)||0;
      state.subjects[key].chapters[i][f] = val;
      if(e.target.classList.contains("status-select")){
        e.target.className = "status-select " + cls(val);
      }
      if(e.target.classList.contains("rev-select")){
        e.target.className = "rev-select " + cls(val);
      }
      queueSave();
      renderDashboard();
    });
  });
}

/* ---------------- Test Series tab ---------------- */
const TEST_CATEGORIES = ["Full Test","MTP","RTP","Past Paper","Test Series","Model Paper","Chapter Test","MCQ Practice","Other"];

function renderTestLogTab(){
  const catCounts = {};
  TEST_CATEGORIES.forEach(c=> catCounts[c] = state.testLog.filter(t=>t.category===c).length);
  const catCards = TEST_CATEGORIES.map(c=>`<div class="card"><div class="num">${catCounts[c]}</div><div class="lbl">${c}</div></div>`).join("");

  const rows = state.testLog.map((t,i)=>`
    <tr>
      <td data-label="Date">${t.date||""}</td>
      <td data-label="Category">${t.category||""}</td>
      <td data-label="Source / Booklet">${t.source||""}</td>
      <td data-label="Subject">${CATALOG[t.subject]?CATALOG[t.subject].name:t.subject}</td>
      <td data-label="Topic">${t.topic||""}</td>
      <td data-label="Marks">${t.marks}/${t.total}</td>
      <td data-label="%">${t.total? Math.round(t.marks/t.total*100):0}%</td>
      <td data-label="Notes">${t.notes||""}</td>
      <td data-label=""><button class="del-btn" data-i="${i}">Delete</button></td>
    </tr>`).join("");

  return `
    <h2 class="tabtitle">Test Series & MCQ Practice Log</h2>
    <div class="cards">${catCards}</div>
    <div class="testform">
      <div><label>Date</label><input type="date" id="t-date"></div>
      <div><label>Category</label>
        <select id="t-category">${TEST_CATEGORIES.map(c=>`<option>${c}</option>`).join("")}</select>
      </div>
      <div><label>Source / Booklet</label><input type="text" id="t-source" placeholder="e.g. ICAI RTP, VG Learning, Self"></div>
      <div><label>Subject</label>
        <select id="t-subject">${Object.keys(CATALOG).map(k=>`<option value="${k}">${CATALOG[k].name}</option>`).join("")}</select>
      </div>
      <div><label>Topic / Chapter</label><input type="text" id="t-topic" placeholder="e.g. Ind AS 115"></div>
      <div><label>Marks Obtained</label><input type="number" id="t-marks" value="0"></div>
      <div><label>Total Marks</label><input type="number" id="t-total" value="100"></div>
      <div style="grid-column:1/-1;"><label>Notes / Weak Areas</label><input type="text" id="t-notes" placeholder="topics to revisit"></div>
      <button id="addTestBtn">+ Add Entry</button>
    </div>
    <div class="subject-table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Category</th><th>Source / Booklet</th><th>Subject</th><th>Topic</th><th>Marks</th><th>%</th><th>Notes</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  `;
}

function attachTestLogListeners(){
  document.getElementById("addTestBtn").addEventListener("click", ()=>{
    const entry = {
      date: document.getElementById("t-date").value,
      category: document.getElementById("t-category").value,
      source: document.getElementById("t-source").value,
      subject: document.getElementById("t-subject").value,
      topic: document.getElementById("t-topic").value,
      marks: Number(document.getElementById("t-marks").value)||0,
      total: Number(document.getElementById("t-total").value)||0,
      notes: document.getElementById("t-notes").value
    };
    state.testLog.unshift(entry);
    queueSave();
    renderTab("TESTLOG");
    renderDashboard();
  });
  document.querySelectorAll(".del-btn").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      state.testLog.splice(Number(e.target.dataset.i),1);
      queueSave();
      renderTab("TESTLOG");
      renderDashboard();
    });
  });
}

/* ---------------- Tab machinery ---------------- */
const TABS = ["DASH", ...Object.keys(CATALOG), "TESTLOG"];
function tabLabel(t){
  if(t==="DASH") return "📊 Dashboard";
  if(t==="TESTLOG") return "📝 Test Series";
  return CATALOG[t].name.split(" ")[0]==="Integrated" ? "IBS" : CATALOG[t].name.split(/[,(]/)[0].trim().split(" ").slice(0,2).join(" ");
}
let activeTab = "DASH";

function renderNav(){
  const nav = document.getElementById("tabNav");
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t}" class="${t===activeTab?'active':''}">${tabLabel(t)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ activeTab=b.dataset.tab; renderNav(); showTab(activeTab); });
  });
}

function renderTab(t){
  const main = document.getElementById("main");
  let el = document.getElementById(`tab-${t}`);
  if(!el){
    el = document.createElement("div");
    el.id = `tab-${t}`;
    el.className = "tab";
    main.appendChild(el);
  }
  if(t==="DASH"){
    el.innerHTML = `<h2 class="tabtitle">Dashboard</h2><div id="dash-content"></div>`;
    renderDashboard();
  } else if(t==="TESTLOG"){
    el.innerHTML = renderTestLogTab();
    attachTestLogListeners();
  } else {
    el.innerHTML = renderSubjectTab(t);
    attachSubjectListeners(t);
  }
}

function showTab(t){
  document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));
  const el = document.getElementById(`tab-${t}`);
  if(el) el.classList.add("active");
}

function init(){
  loadState();
  document.getElementById("examDate").value = state.examDate || "";
  updateCountdown();
  document.getElementById("examDate").addEventListener("change",(e)=>{
    state.examDate = e.target.value;
    updateCountdown();
    queueSave();
  });
  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "ca-final-tracker-backup.json"; a.click();
    URL.revokeObjectURL(url);
  });

  renderNav();
  TABS.forEach(t=>renderTab(t));
  showTab(activeTab);
  setSaveStatus(false);
}

init();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
</body>
</html>
